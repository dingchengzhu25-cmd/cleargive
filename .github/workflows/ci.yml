name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Uses the pnpm version pinned in package.json ("packageManager": "pnpm@11.25.0").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build must run before test: it generates artifacts/contracts.json and
      # public/assets/demo-chain.json, which the tests read.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
